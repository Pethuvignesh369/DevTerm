[package]
name = "devterm"
version = "0.1.0"
description = "A modern SSH client for DevOps engineers"
authors = ["DevTerm"]
edition = "2021"

[lib]
name = "devterm_lib"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "devterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
